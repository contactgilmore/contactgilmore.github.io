name: Temporary central-first master alignment

on:
  push:
    branches: [governance-central-first-startup]

permissions:
  contents: write

jobs:
  align-master:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
      - name: Insert mandatory central-first startup gate
        shell: bash
        env:
          CENTRAL_FIRST_BLOCK_B64: 
        run: |
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          path = Path('00_MASTER/00_MASTER_DOCTRINE.md')
          text = path.read_text()
          marker = '## Mandatory central-first startup gate'
          if marker in text:
              raise SystemExit('REFUSE: central-first gate already present')
          anchor = '\n## Purpose\n'
          if anchor not in text:
              raise SystemExit('REFUSE: Purpose anchor missing')
          block = base64.b64decode(os.environ['CENTRAL_FIRST_BLOCK_B64']).decode()
          path.write_text(text.replace(anchor, '\n' + block + '## Purpose\n', 1))
          PY
          git rm .github/workflows/temporary-central-first-alignment.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add 00_MASTER/00_MASTER_DOCTRINE.md
          git diff --cached --check
          git commit -m "Make central-first startup explicit"
          git push origin HEAD
